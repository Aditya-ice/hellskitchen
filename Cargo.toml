[workspace]
resolver = "2"
members = ["crates/ember-core", "crates/ember-store", "crates/ember-server", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
# Staff PINs are low-entropy by nature, so the hash is only half the defence;
# see the lockout in ember-store::auth for the other half.
argon2 = "0.5"
# Pinned to the rand_core that argon2's password-hash uses, with getrandom
# enabled -- OsRng is compiled out otherwise.
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
thiserror = "2"
ember-core = { path = "crates/ember-core" }
ember-store = { path = "crates/ember-store" }
ember-server = { path = "crates/ember-server" }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
